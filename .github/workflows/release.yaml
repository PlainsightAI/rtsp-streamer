name: Release

# Bumps VERSION, tags, and cuts a GitHub release. Pushing the tag is what triggers
# the publish job in ci.yaml, which builds and pushes the image to Docker Hub.
#
# The bump is inlined rather than delegated to a shared composite because this is a
# public repository: a private action would not resolve for anyone outside the org,
# including forks, and the logic is a dozen lines of arithmetic.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (major, minor, patch)'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # GH_BOT_USER_PAT, not FILTER_RELEASE_GH_TOKEN: the latter is an org secret
      # with `private` visibility, which GitHub grants only to private and internal
      # repositories, so it resolves to an empty string here and every step using it
      # would fail. GH_BOT_USER_PAT is one of the three org secrets with `all`
      # visibility, and it is what the other public repositories in this org use.
      # It also has to be a PAT rather than the intrinsic GITHUB_TOKEN for two
      # reasons: a push authenticated with GITHUB_TOKEN does not trigger further
      # workflows, so the tag would never start the publish job in ci.yaml, and the
      # bot it belongs to is in @PlainsightAI/admins, which the org branch ruleset
      # lists as an always-bypass actor - the push to main would otherwise be
      # rejected for not going through a pull request.
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_BOT_USER_PAT }}

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Bump version
        id: bump
        shell: bash
        run: |
          CURRENT_VERSION=$(cat VERSION)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "${{ inputs.release_type }}" in
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            *)     NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "$CURRENT_VERSION -> $NEW_VERSION"
          echo "$NEW_VERSION" > VERSION
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        shell: bash
        run: |
          git add VERSION
          git commit -m "Bump version to ${{ steps.bump.outputs.new_version }}"
          git tag -a "v${{ steps.bump.outputs.new_version }}" -m "Release v${{ steps.bump.outputs.new_version }}"
          git push origin main
          git push origin "v${{ steps.bump.outputs.new_version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "v${{ steps.bump.outputs.new_version }}"
          tag_name: "v${{ steps.bump.outputs.new_version }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_BOT_USER_PAT }}
