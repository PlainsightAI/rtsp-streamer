name: CI

on:
  push:
    tags:
      - 'v*.*.*'  # trigger only on version tags, e.g. v1.0.0
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:  # allows manual triggering

jobs:
  # Every push and PR builds the image, so a broken Dockerfile is caught before a
  # release tag is cut. No push here — only the publish job below pushes.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: "."
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # keyless cosign signing for the SBOM attestation
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: plainsightai
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: "."
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            plainsightai/rtsp-streamer:${{ steps.version.outputs.version }}
            plainsightai/rtsp-streamer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signed SPDX SBOM on the pushed manifest list. tlog defaults to true, which is
      # what a public image wants: Rekor supplies the timestamp and anyone can verify
      # the attestation without trusting us for the signing time.
      - name: SBOM + keyless attest
        uses: PlainsightAI/gh-actions-public/attest-sbom@main
        with:
          image: plainsightai/rtsp-streamer:${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
